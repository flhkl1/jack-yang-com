<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production — Jack Yang</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="site-header">
    <a class="site-wordmark" href="/">Jack Yang</a>
    <nav class="site-nav">
      <a href="/production">Production</a>
      <button type="button" class="theme-toggle" aria-label="Toggle light and dark theme"></button>
    </nav>
  </header>

  <main class="article-wrap" id="article"></main>

  <script src="/js/posts.js"></script>
  <script>
    (function() {
      var slug = decodeURIComponent(location.pathname.replace(/^\/production\/?/, '').replace(/\/$/, ''));
      var post = (window.POSTS || []).filter(function(p) { return p.slug === slug; })[0];
      var el = document.getElementById('article');

      if (!post) {
        el.innerHTML = '<a class="article-back" href="/production">← Production</a>' +
          '<h1 class="article-title">Not found</h1>' +
          '<p class="article-meta">No piece with that name.</p>';
        return;
      }

      // Externally published pieces live at the publisher; don't shadow them here.
      if (post.url) {
        location.replace(post.url);
        return;
      }

      var parts = post.date.split('-');
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]))
        .toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      document.title = post.title + ' — Jack Yang';
      el.innerHTML = '<a class="article-back" href="/production">← Production</a>' +
        '<h1 class="article-title"></h1>' +
        '<p class="article-meta"></p>' +
        '<div class="article-body"></div>';

      el.querySelector('.article-title').textContent = post.title;
      el.querySelector('.article-meta').textContent =
        [date, post.outlet, post.role].filter(Boolean).join(' · ');
      el.querySelector('.article-body').innerHTML = post.body || '';
    })();
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
