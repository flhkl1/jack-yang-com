<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <header class="site-header">
    <nav class="side-nav">

      <a href="/">Home</a>

    </nav>

  <main class="article-wrap" id="article"></main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="/js/content.js"></script>
  <script>
    (function() {
      // One page serves writing and project case studies; the first path
      // segment says which, and the item must be of the matching type.
      var m = location.pathname.match(/^\/(writing|projects)\/([^/]+)\/?$/);
      var section = m ? m[1] : 'writing';
      var slug = m ? decodeURIComponent(m[2]) : '';
      var type = section === 'projects' ? 'Project' : 'Writing';
      var back = '<a class="article-back" href="/' + section + '">← ' +
        (section === 'projects' ? 'Projects' : 'Writing') + '</a>';
      var post = (window.ITEMS || []).filter(function(p) {
        return p.slug === slug && p.type === type && (type === 'Writing' || p.caseStudy);
      })[0];
      var el = document.getElementById('article');

      if (section === 'projects') {
        var navLink = document.querySelector('.side-nav a[href="/projects"]');
        if (navLink) navLink.setAttribute('aria-current', 'page');
      }

      function fail(heading, detail) {
        el.innerHTML = back +
          '<h1 class="article-title"></h1>' +
          '<p class="article-meta"></p>';
        el.querySelector('.article-title').textContent = heading;
        el.querySelector('.article-meta').textContent = detail;
      }

      if (!post) {
        fail('Not found', 'No piece with that name.');
        return;
      }

      // Externally published pieces live at the publisher; don't shadow them here.
      if (post.url) {
        location.replace(post.url);
        return;
      }

      var parts = post.date.split('-');
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]))
        .toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      document.title = post.title + ' — Jack Yang';
      el.innerHTML = back +
        '<h1 class="article-title"></h1>' +
        '<p class="article-meta"></p>' +
        (post.note ? '<p class="project-note"></p>' : '') +
        '<div class="article-body"></div>';

      el.querySelector('.article-title').textContent = post.title;
      el.querySelector('.article-meta').textContent = type === 'Project'
        ? [post.org, post.role, post.period].filter(Boolean).join(' · ')
        : [date, post.outlet, post.role].filter(Boolean).join(' · ');
      if (post.note) el.querySelector('.project-note').textContent = post.note;

      // The body lives in its own file so index pages don't download every article.
      // A post is written as posts/<slug>.md; older ones are still posts/<slug>.html.
      function get(ext) {
        return fetch('/posts/' + encodeURIComponent(post.slug) + ext).then(function(res) {
          if (!res.ok) throw new Error(res.status);
          return res.text();
        });
      }
      // Posts marked `math: true` hold $…$ / $$…$$ TeX. Markdown would mangle the
      // underscores and backslashes inside it, so it is set aside before parsing
      // and put back (escaped) for KaTeX to render. Other posts use $ for prices.
      function toHtml(md) {
        if (!post.math) return window.marked.parse(md);
        var tex = [];
        md = md.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, function(m) {
          tex.push(m);
          return 'MATHSLOT' + (tex.length - 1) + 'END';
        });
        return window.marked.parse(md).replace(/MATHSLOT(\d+)END/g, function(_, i) {
          return tex[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        });
      }
      get('.md')
        .then(toHtml)
        .catch(function() { return get('.html'); })
        .then(function(html) {
          var body = el.querySelector('.article-body');
          body.innerHTML = html;
          if (post.math && window.renderMathInElement) {
            window.renderMathInElement(body, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
              ],
              throwOnError: false,
            });
          }
        })
        .catch(function() {
          fail('Unavailable', "This piece couldn't be loaded. Try again in a moment.");
        });
    })();
  </script>
</body>
</html>
