<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research — Jack Yang</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="site-header">
    <nav class="side-nav">
      <h3>Navigation</h3>
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/research" aria-current="page">Research</a>
      <a href="/writing">Writing</a>
      <a href="/library">Library</a>

      <h3>Find me on</h3>
      <a href="https://github.com/flhkl1" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/jackyang03" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:jackyang03@berkeley.edu">Email</a>
      <a href="/assets/NewestResume.pdf" target="_blank" rel="noopener">Resume</a>
    </nav>
  </header>

  <main class="site-main site-main--single">
    <section>
      <div class="filter-bar">
        <div class="links" id="profile-links"></div>
      </div>
      <div id="posts"></div>
    </section>
  </main>

  <script src="/js/content.js"></script>
  <script src="/js/cards.js"></script>
  <script>
    (function() {
      var papers = (window.ITEMS || []).filter(function(i) { return i.type === 'Research'; });
      papers.sort(function(a, b) { return b.date.localeCompare(a.date); });

      var postsEl = document.getElementById('posts');

      // Rendered only once the URL exists, so there is never a dead link.
      var scholar = (window.PROFILES || {}).scholar;
      if (scholar) {
        document.getElementById('profile-links').innerHTML =
          '<a href="' + window.Cards.escapeHtml(scholar) + '" target="_blank" rel="noopener">Google Scholar</a>';
      }

      window.Cards.render(postsEl, papers, window.Cards.researchCard);
    })();
  </script>
</body>
</html>
