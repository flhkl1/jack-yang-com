<body>
  <header class="site-header">
    <nav class="side-nav">

    </nav>
  </header>

  <main class="site-main site-main--single">
    <section>
      <div class="list-head">
        <button type="button" class="sort-control" id="sort" data-order="new">Sort by: Most recent ⌄</button>
      </div>
      <div id="posts"></div>
    </section>
  </main>

  <script src="/js/content.js"></script>
  <script src="/js/cards.js"></script>
  <script>
    (function() {
      var posts = (window.ITEMS || []).filter(function(i) { return i.type === 'Writing'; });
      var order = 'new';
      var postsEl = document.getElementById('posts');
      var sortEl = document.getElementById('sort');

      function renderPosts() {
        // `pinned: true` puts a piece first in the default (most recent) view.
        var list = posts.slice().sort(function(a, b) {
          if (order === 'new') return Boolean(b.pinned) - Boolean(a.pinned) || b.date.localeCompare(a.date);
          return a.date.localeCompare(b.date);
        });
        window.Cards.render(postsEl, list, window.Cards.writingCard);
      }

      sortEl.addEventListener('click', function() {
        order = order === 'new' ? 'old' : 'new';
        sortEl.textContent = 'Sort by: ' + (order === 'new' ? 'Most recent' : 'Oldest') + ' ⌄';
        renderPosts();
      });

      renderPosts();
    })();
  </script>
</body>
</html>
